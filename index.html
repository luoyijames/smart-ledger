<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="智能记账">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>智能记账</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view" aria-live="polite"></main>
</div>
<nav id="nav" aria-label="主导航">
  <button data-tab="home"><i>🏠</i><span>首页</span></button>
  <button data-tab="list"><i>📒</i><span>记账</span></button>
  <button data-tab="stats"><i>📊</i><span>统计</span></button>
  <button data-tab="budget"><i>🎯</i><span>预算</span></button>
  <button data-tab="settings"><i>⚙️</i><span>设置</span></button>
</nav>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="file-import" accept=".csv,.txt,.xlsx,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="file-restore" accept=".json,application/json" hidden>
<noscript><p style="padding:24px">智能记账需要开启 JavaScript 才能使用。</p></noscript>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
